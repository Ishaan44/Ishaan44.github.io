<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}Ishaan Bhadoo</title>

  <style>
    :root {
      --text: #111;
      --muted: #666;
      --link: #0645ad;
      --border: #ddd;
      --bg: #fff;
    }

    html {
      background: var(--bg);
    }

    body {
      max-width: 850px;
      margin: 0 auto;
      padding: 34px 22px 28px;
      color: var(--text);
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 17px;
      line-height: 1.55;
    }

    header {
      margin-bottom: 2.2rem;
    }

    nav.site-nav {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.8;
    }

    nav.site-nav a {
      margin-right: 1.05rem;
      color: var(--link);
      text-decoration: none;
      white-space: nowrap;
    }

    nav.site-nav a:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0 0 1.2rem;
      font-size: 2rem;
      line-height: 1.2;
      font-weight: 500;
    }

    h2 {
      margin-top: 2rem;
      margin-bottom: 0.7rem;
      font-size: 1.4rem;
      font-weight: 500;
    }

    h3 {
      margin-top: 1.5rem;
      margin-bottom: 0.25rem;
      font-size: 1.08rem;
      font-weight: 600;
    }

    p {
      margin: 0 0 1rem;
    }

    ul {
      margin-top: 0.3rem;
      padding-left: 1.35rem;
    }

    li {
      margin: 0.3rem 0;
    }

    a {
      color: var(--link);
    }

    img.profile-photo {
      display: block;
      width: 265px;
      max-width: 75%;
      height: auto;
      margin: 0 0 1.25rem;
      border-radius: 2px;
    }

    .paper {
      margin-bottom: 1.35rem;
    }

    .paper-title {
      font-weight: 600;
    }

    .paper-links a {
      margin-right: 0.35rem;
    }

    .post-meta,
    .small {
      color: var(--muted);
      font-size: 0.94rem;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 18px;
        font-size: 16px;
      }

      nav.site-nav a {
        display: inline-block;
        margin-bottom: 0.35rem;
      }
    }
  </style>

  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "{{ site.google_analytics }}");
  </script>
  {% endif %}

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
  <header>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/' | relative_url }}#education">Education</a>
      <a href="{{ '/' | relative_url }}#research">Research</a>
      <a href="{{ '/' | relative_url }}#teaching">Teaching</a>
      <a href="{{ '/assets/pdf/CV_new.pdf' | relative_url }}">CV</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    © {{ "now" | date: "%Y" }} Ishaan Bhadoo
  </footer>
</body>
</html>
